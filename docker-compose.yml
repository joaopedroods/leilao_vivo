version: "3.9"

services:
  postgres-leiloes:
    image: postgres:16
    container_name: leilaovivo-postgres-leiloes
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leiloes_db
    ports:
      - "5432:5432"
    volumes:
      - pg_leiloes_data:/var/lib/postgresql/data

  postgres-carteira:
    image: postgres:16
    container_name: leilaovivo-postgres-carteira
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilaovivo
      POSTGRES_PASSWORD: leilaovivo
      POSTGRES_DB: contas_carteira
    ports:
      - "5433:5432"
    volumes:
      - pg_carteira_data:/var/lib/postgresql/data

  postgres-notificacoes:
    image: postgres:16
    container_name: leilaovivo-postgres-notificacoes
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilaovivo
      POSTGRES_PASSWORD: leilaovivo
      POSTGRES_DB: notificacoes
    ports:
      - "5434:5432"
    volumes:
      - pg_notificacoes_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: leilaovivo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: leilaovivo-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pg_leiloes_data:
  pg_carteira_data:
  pg_notificacoes_data:
