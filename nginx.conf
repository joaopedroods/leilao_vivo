events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Microsserviço de Contas & Carteira (Porta 3002)
        location /api/contas/ {
            proxy_pass http://host.docker.internal:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microsserviço de Leilão (Porta 3001)
        location /api/leiloes/ {
            proxy_pass http://host.docker.internal:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microsserviço de Notificações (Porta 3003) + Suporte a WebSockets
        location /api/notificacoes/ {
            proxy_pass http://host.docker.internal:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}