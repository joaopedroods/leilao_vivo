<!DOCTYPE html>
<html>
<head>
  <title>Teste WebSocket</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h2>Teste WebSocket — LeilãoVivo</h2>
  <div id="log" style="font-family: monospace; white-space: pre;"></div>

  <script>
        const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIwMDcyOGQ0Zi04ODA3LTRjZjctODU1MC0wYWZhMDA2ZWU1ZjIiLCJpYXQiOjE3ODMwNDY0NjgsImV4cCI6MTc4MzEzMjg2OH0.samuNv2hDU1CqMly87M6nOSS8LWbt-I6IbxgGhCekXc'
        const LEILAO_ID = '8d8d7851-6835-4dbd-afd4-46a42700da12'

    const log = (msg) => {
      document.getElementById('log').textContent += '\n' + JSON.stringify(msg, null, 2)
    }

    const socket = io('http://localhost:3001', {
      auth: { token: TOKEN }
    })

    socket.on('connect', () => {
      log({ evento: 'conectado', id: socket.id })
      socket.emit('entrar_leilao', LEILAO_ID)
    })

    socket.on('estado_atual', (estado) => log({ evento: 'estado_atual', ...estado }))
    socket.on('lance_aceito', (dados) => log({ evento: 'lance_aceito', ...dados }))
    socket.on('lance_rejeitado', (dados) => log({ evento: 'lance_rejeitado', ...dados }))
    socket.on('erro', (dados) => log({ evento: 'erro', ...dados }))

    // Dar um lance após 2 segundos
    setTimeout(() => {
      log({ evento: 'enviando_lance', valor: 250 })
      socket.emit('dar_lance', { leilaoId: LEILAO_ID, valor: 250 })
    }, 2000)
  </script>
</body>
</html>
